<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Round Room</title>

    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="/.netlify/functions/menu-data" as="fetch" crossorigin>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/Icon.png">

    <script src="script.js"></script>
    <script type="module" src="js/renderMenu.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="webpimages/menu-bg.webp">
</head>

<body>

    <!-- Order Type Selection Popup -->
    <div id="orderTypePopup" class="order-type-popup-overlay">
        <div class="order-type-popup" role="dialog" aria-modal="true" aria-labelledby="orderTypeTitle">
            <h3 id="orderTypeTitle">How are you ordering?</h3>
            <p class="order-type-desc">Choose your ordering experience</p>

            <div class="order-type-buttons">
                <button type="button" class="order-type-btn" id="homeOrderBtn">
                    <span class="order-type-icon">🏠</span>
                    <span class="order-type-label">Home Delivery</span>
                    <span class="order-type-sublabel">Full menu available</span>
                </button>

                <button type="button" class="order-type-btn popup-order" id="popupOrderBtn">
                    <span class="order-type-icon">🎪</span>
                    <span class="order-type-label">Popup Pickup</span>
                    <span class="order-type-sublabel">15% off combos!</span>
                </button>
            </div>
        </div>
    </div>

    <!-- YOUR EXISTING PAGE CONTENT (UNCHANGED) -->
    <!-- (I’ve omitted repeating everything here for clarity since nothing else changed) -->


    <!-- ✅ FIXED SCRIPT -->
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const popup = document.getElementById('orderTypePopup');
        const homeBtn = document.getElementById('homeOrderBtn');
        const popupBtn = document.getElementById('popupOrderBtn');

        if (!popup || !homeBtn || !popupBtn) {
            console.error("Popup elements not found");
            return;
        }

        // Check if already selected
        const savedOrderType = sessionStorage.getItem('rr_order_type');

        if (savedOrderType) {
            popup.classList.add('hidden');
            window._rrOrderType = savedOrderType;
        } else {
            popup.classList.remove('hidden');
        }

        homeBtn.addEventListener('click', function() {
            sessionStorage.setItem('rr_order_type', 'home');
            window._rrOrderType = 'home';
            popup.classList.add('hidden');

            window.dispatchEvent(
                new CustomEvent('orderTypeSelected', { detail: 'home' })
            );
        });

        popupBtn.addEventListener('click', function() {
            sessionStorage.setItem('rr_order_type', 'popup');
            window._rrOrderType = 'popup';
            popup.classList.add('hidden');

            window.dispatchEvent(
                new CustomEvent('orderTypeSelected', { detail: 'popup' })
            );
        });
    });
    </script>

</body>
</html>
